<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0a0f1c">
<title>Royal blocks · ValueIt Lesson prototype</title>
<!--
  PROTOTYPE, throwaway. The fourth look, "Royal blocks": Playful blocks, made professional.
  Dark, minimal, one royal blue accent. The Widget is a lit object in a quiet dark room. See NOTES.md.
  Plain HTML, CSS and JavaScript: no build step, nothing from the network.
-->
<link rel="stylesheet" href="royal.css">
</head>
<body>
<header class="bar">
  <div class="bar-lesson">
    <span class="brand">ValueIt</span>
    <p class="lesson-id"><span class="lesson-topic"></span><strong class="lesson-title"></strong></p>
  </div>
  <div class="bar-status">
    <div class="progress">
      <ol class="steps" aria-label="Lesson progress"></ol>
      <p class="progress-now"></p>
    </div>
    <button type="button" class="btn ghost notes-open" aria-haspopup="dialog">
      <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5h5.5L12 5v8.5H4z"/><path d="M9.5 2.5V5H12M6.25 8h3.5M6.25 10.5h3.5"/></svg><span class="notes-label">Notes (<span class="notes-count">3</span>)</span>
    </button>
  </div>
</header>

<main>
  <section data-pane="chat" aria-label="Lesson conversation">
    <div class="scroll" tabindex="-1">
      <div class="doc" role="log" aria-label="Conversation with the Chatbot"></div>
    </div>
    <form class="composer" autocomplete="off">
      <label class="field">
        <span class="sr-only">Message the Chatbot</span>
        <input type="text" name="message" placeholder="Ask, or answer the Chatbot" enterkeyhint="send">
      </label>
      <button type="button" class="btn ghost stuck">I'm stuck</button>
      <button type="submit" class="btn tonal send"><span>Send</span><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13V3.5M4 7.25 8 3.25l4 4"/></svg></button>
    </form>
  </section>

  <section data-pane="widget" aria-label="Widget">
    <div class="tabbar">
      <div class="tabs" role="tablist" aria-label="Widgets"></div>
      <button type="button" class="jump" hidden></button>
    </div>
    <div class="panel" role="tabpanel" id="widget-panel" tabindex="-1"></div>
  </section>
</main>

<dialog class="sheet" aria-labelledby="notes-title">
  <header class="sheet-head">
    <div>
      <h2 id="notes-title">Notes</h2>
      <p class="sheet-sub"></p>
    </div>
    <button type="button" class="btn ghost sheet-close">Close</button>
  </header>
  <div class="sheet-body"></div>
</dialog>

<div class="sr-only" id="announce" aria-live="polite"></div>

<script src="../../lesson.js"></script>
<script src="../../widgets.js"></script>
<script src="../bridge.js"></script>
<script src="royal.js"></script>
</body>
</html>
